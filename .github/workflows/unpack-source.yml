name: Expand project source
on:
  push:
    branches: [main]
    paths:
      - project-source.zip
      - .github/workflows/unpack-source.yml
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract source files into repository
        run: |
          if [ -f project-source.zip ]; then
            unzip -o project-source.zip -d .
            rm project-source.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: expand project source into repository"
              git push origin main
            fi
          fi
